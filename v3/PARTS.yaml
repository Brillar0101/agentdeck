# ClaudeMicro V3 - single source of truth for every component.
#
# RULES (docs/DESIGN-V3.md):
#   * Every part used on the board MUST have an entry here BEFORE it enters the
#     schematic generator. verify_parts.py cross-checks the PCB against this file.
#   * dims_2d  = courtyard footprint X x Y in mm (board plan view)
#   * height_3d = tallest point above PCB surface in mm (drives case cavity/lid)
#   * hand_solder: easy (iron, any tip) | medium (fine tip, flux) | drag (0.5-0.65mm
#     pitch drag soldering) -- nothing below "drag" is allowed in V3.
#   * stock: CONFIRMED = seen in stock at JLCPCB/LCSC on stock_date.
#            VERIFY    = must be re-checked before the parts order (Phase 5 gate).
#   * dims marked source: datasheet are nominal package dims; source: v1-blend are
#     measured from the V1 3D assembly (real model bounding boxes).

meta:
  version: 3
  board: ClaudeMicroV3
  currency: USD
  updated: 2026-07-28

