  - ref_prefix: MK1
    name: SPH0645LM4H-B I2S MEMS microphone, bottom port
    lcsc: null
    package: SMD 3.5x2.65 class
    pitch_mm: null
    dims_2d: [3.5, 2.65]
    height_3d: 1.0
    dims_source: datasheet
    hand_solder: medium
    stock: EXTERNAL            # DECIDED 2026-08-10. MSM261S4030H0R (C2840615)
                               # is dropped on two counts, not one:
                               #  1. LCSC page still 404 (re-checked 2026-08-10);
                               #     it survives only in JLCPCB's assembly
                               #     catalogue, which is no use for a hand-built
                               #     board that needs loose parts.
                               #  2. Its datasheet says "Top-ported" - the whole
                               #     acoustic design (rule 11, the 0.9 mm PCB
                               #     port + mic_port_void ring cut by
                               #     place_pcb.py) assumes a BOTTOM port. Built
                               #     as drawn it would listen at the case, not
                               #     through the hole.
                               # SPH0645LM4H is bottom-ported I2S, in active
                               # production, and the vendor-named replacement
                               # for the discontinued ICS-43434 - so it matches
                               # rule 11 and the port already in the board.
                               # Distributor: DigiKey/Adafruit (not LCSC).
                               # Fallback: INMP441 breakout, or ICS-43434 while
                               # DigiKey stock lasts (~210k, EOL).
    unit_price: 1.50
    qty_per_board: 1
    notes: Bottom-ported - PCB port hole + case gasket (rule 11). Verify the
      SPH0645LM4H land pattern against V4.pretty before Phase 5; it is a
      different footprint from the MSM261 the port was drawn around.

