# AgentDeck V4 - single source of truth for every component.
# Same rules as v3/PARTS.yaml (see its header + docs/DESIGN-V4.md):
# manifest-first, dims verified by tools, hand-solder floor 0.5 mm pitch,
# stock: CONFIRMED (seen live on stock_date) | VERIFY | EXTERNAL | N/A.
#
# V4 = V3 platform + audio (mic/amp/speaker) + 1.69" touch LCD + 2nd encoder.
# Carried-over lines were live-confirmed at LCSC on 2026-07-29 (V3 pass).

