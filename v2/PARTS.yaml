# AgentDeck V2 parts manifest
# Pattern follows v3/PARTS.yaml. stock: CONFIRMED means checked live on LCSC
# on stock_date; VERIFY means the line must be re-checked before ordering.
# Carried lines inherit their verification from the file named in `source`.

meta:
  version: v2
  concept: 20-key USB deck on the ESP32-S3 platform (BLE capable)
  checked: 2026-08-11

parts:
  # ---- new in V2 ----
  - ref_prefix: DM1-DM20
    name: 1N4148W matrix diode
    lcsc: C81598
    source: v3/PARTS.yaml
    qty_per_board: 20
    notes: One per key; V2 uses the V3 matrix wiring.

  # ---- carried from v3/PARTS.yaml (already stock-checked there) ----
  - ref_prefix: U5
    name: ME6211C33M5G-N 3.3V LDO (VBUS input)
    source: v3/PARTS.yaml
    qty_per_board: 1

  - ref_prefix: U1
    name: ESP32-S3-WROOM-1-N8R2
    lcsc: C2913204
    source: v3/PARTS.yaml
    qty_per_board: 1
    notes: Antenna overhangs a copper-free board-edge zone.

  # ---- carried from V1 (fab/AgentDeck-BOM-v1.0.0.csv) ----
  - ref_prefix: U2
    name: SN74AHCT1G125 LED level shifter
    lcsc: C7484
    source: v1
    qty_per_board: 1

  - ref_prefix: SW26-SW27
    name: TS-1187A tact (BOOT + RESET)
    lcsc: C318884
    source: v1
    qty_per_board: 2

  - ref_prefix: D1-D20
    name: SK6812MINI-E reverse-mount RGB
    lcsc: C5149201
    source: v1
    qty_per_board: 20

  - ref_prefix: ENC1
    name: EC11 rotary encoder
    lcsc: C361165
    source: v1
    qty_per_board: 1

  - ref_prefix: JS1
    name: Alps SKQUCAA010 5-way joystick
    lcsc: null
    stock: EXTERNAL            # AliExpress/Newark, see V1 BOM notes
    source: v1
    qty_per_board: 1

  - ref_prefix: J1
    name: USB-C receptacle TYPE-C-31-M-12
    lcsc: C165948
    source: v1
    qty_per_board: 1

  - ref_prefix: U6
    name: USBLC6-2SC6 ESD
    lcsc: C7519
    source: v1
    qty_per_board: 1

  - ref_prefix: SW1-SW20
    name: Kailh Choc hot-swap socket CPG135001S30
    lcsc: null
    stock: EXTERNAL            # AliExpress, LCSC line discontinued
    source: v1
    qty_per_board: 20
